version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cloudery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cloudery-stack:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"  # Control Plane API
      - "4001:4001"  # Remote MCP Server
      - "4002:4002"  # Edge Auth Gateway
      - "3000:3000"  # Web Catalog UI
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/cloudery
      - VERCEL_TOKEN=${VERCEL_TOKEN}
      - VERCEL_TEAM_ID=${VERCEL_TEAM_ID}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-agent-api-483208}
      - GCP_PROJECT_NUMBER=${GCP_PROJECT_NUMBER:-1054958029786}
      - GCP_REGION=${GCP_REGION:-us-central1}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - API_URL=${API_URL}
      - MCP_URL=${MCP_URL}
      - WEB_URL=${WEB_URL}
    depends_on:
      - postgres

volumes:
  pgdata:
