<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Metrics Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #090d16; color: #f3f4f6; padding: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .metric { background: #121a2a; padding: 1.5rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <h1>Q3 Engineering Metrics</h1>
  <div class="grid">
    <div class="metric">
      <h3>Active Apps</h3>
      <h2>14</h2>
    </div>
    <div class="metric">
      <h3>Audit Events</h3>
      <h2>1,420</h2>
    </div>
    <div class="metric">
      <h3>Uptime</h3>
      <h2>99.98%</h2>
    </div>
  </div>
</body>
</html>
